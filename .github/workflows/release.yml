name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time; a newer push waits rather than cancelling a publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bump, push tags, create releases
      pull-requests: write # open the "Version Packages" pull request
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # changeset publish runs `npm publish`; trusted publishing needs npm >= 11.5.1.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      # With pending changesets: opens or updates the "Version Packages" PR.
      # Without them: publishes every package whose version is not on npm yet,
      # then pushes tags and creates GitHub releases.
      - uses: changesets/action@v2.1.2
        with:
          # RELEASE_TOKEN is optional: a fine-grained token with Contents and
          # Pull requests write access. Needed when the organization does not let
          # GitHub Actions create pull requests; it also makes CI run on the
          # version pull request, which the default token does not trigger.
          github-token: ${{ secrets.RELEASE_TOKEN || github.token }}
          version-script: bun run version-packages
          publish-script: bun run release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          # Optional. Without it npm authenticates through trusted publishing (OIDC).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
